<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5967"/></marker></defs><rect width="1040" height="420" fill="#fff"/><text x="20" y="26" font-size="15" font-weight="700" fill="#1d2935">Call state machine</text><rect x="20" y="90" width="130" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="85.0" y="117.0" text-anchor="middle" font-weight="600" fill="#1d2935">RESERVED</text><rect x="200" y="90" width="130" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="265.0" y="117.0" text-anchor="middle" font-weight="600" fill="#1d2935">INITIATED</text><rect x="380" y="90" width="130" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="445.0" y="117.0" text-anchor="middle" font-weight="600" fill="#1d2935">RINGING</text><rect x="560" y="90" width="130" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="625.0" y="117.0" text-anchor="middle" font-weight="600" fill="#1d2935">ANSWERED</text><rect x="740" y="90" width="130" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="805.0" y="117.0" text-anchor="middle" font-weight="600" fill="#1d2935">CONNECTED</text><line x1="150" y1="113" x2="200" y2="113" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="330" y1="113" x2="380" y2="113" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="510" y1="113" x2="560" y2="113" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="690" y1="113" x2="740" y2="113" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="260" width="130" height="46" rx="5" fill="#fbe9e6" stroke="#b83a2a"/><text x="85.0" y="287.0" text-anchor="middle" font-weight="600" fill="#1d2935">FAILED</text><rect x="200" y="260" width="130" height="46" rx="5" fill="#fbe9e6" stroke="#b83a2a"/><text x="265.0" y="287.0" text-anchor="middle" font-weight="600" fill="#1d2935">CANCELLED</text><rect x="560" y="260" width="130" height="46" rx="5" fill="#fbe9e6" stroke="#b83a2a"/><text x="625.0" y="287.0" text-anchor="middle" font-weight="600" fill="#1d2935">ABANDONED</text><rect x="740" y="260" width="130" height="46" rx="5" fill="#e1f1e9" stroke="#2f7d5b"/><text x="805.0" y="287.0" text-anchor="middle" font-weight="600" fill="#1d2935">COMPLETED</text><line x1="85" y1="136" x2="85" y2="260" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="92" y="200" font-size="11" fill="#4b5967">never answered</text><line x1="265" y1="136" x2="265" y2="260" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="272" y="200" font-size="11" fill="#4b5967">we cancelled</text><line x1="625" y1="136" x2="625" y2="260" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="632" y="200" font-size="11" fill="#4b5967">no agent in 2 s</text><line x1="805" y1="136" x2="805" y2="260" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="812" y="200" font-size="11" fill="#4b5967">hang up</text><text x="20" y="350" font-size="12" fill="#4b5967">Ranks only go up: a provider event that would move a call backwards is ignored. Terminal states never change.</text><text x="20" y="368" font-size="12" fill="#4b5967">ANSWERED after FAILED or CANCELLED is a ghost call: we record it and queue a HANGUP. COMPLETED seen before ANSWERED counts as answered for the abandon budget.</text><text x="20" y="386" font-size="12" fill="#4b5967">Duplicate events are dropped on the primary key (provider, event id); each event is applied in one transaction.</text></svg>
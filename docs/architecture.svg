<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5967"/></marker></defs><rect width="1040" height="560" fill="#fff"/><text x="20" y="26" font-size="15" font-weight="700" fill="#1d2935">SmartDialer: who may talk to whom</text><rect x="20" y="50" width="200" height="60" rx="5" fill="#eaf1f8" stroke="#1f5f99"/><text x="120.0" y="77.0" text-anchor="middle" font-weight="600" fill="#1d2935">Pacing engine</text><text x="120.0" y="93.0" text-anchor="middle" font-size="11" fill="#4b5967">progressive / predictive</text><rect x="20" y="150" width="200" height="60" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="120.0" y="177.0" text-anchor="middle" font-weight="600" fill="#1d2935">Statistics</text><text x="120.0" y="193.0" text-anchor="middle" font-size="11" fill="#4b5967">answer-rate estimate, risk</text><rect x="330" y="50" width="230" height="60" rx="5" fill="#fbf1dc" stroke="#b7791f"/><text x="445.0" y="77.0" text-anchor="middle" font-weight="600" fill="#1d2935">Safety Controller</text><text x="445.0" y="93.0" text-anchor="middle" font-size="11" fill="#4b5967">can only approve, cut or refuse</text><rect x="330" y="150" width="230" height="60" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="445.0" y="177.0" text-anchor="middle" font-weight="600" fill="#1d2935">Safety state (kv table)</text><text x="445.0" y="193.0" text-anchor="middle" font-size="11" fill="#4b5967">abandon window, shed, cooldown</text><rect x="330" y="250" width="230" height="60" rx="5" fill="#fbf1dc" stroke="#b7791f"/><text x="445.0" y="277.0" text-anchor="middle" font-weight="600" fill="#1d2935">Call allocator</text><text x="445.0" y="293.0" text-anchor="middle" font-size="11" fill="#4b5967">accepts only a sealed ApprovedDispatch</text><rect x="330" y="350" width="230" height="60" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="445.0" y="377.0" text-anchor="middle" font-weight="600" fill="#1d2935">Provider router</text><text x="445.0" y="393.0" text-anchor="middle" font-size="11" fill="#4b5967">circuit breaker, idempotency key</text><rect x="650" y="330" width="230" height="40" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="765.0" y="354.0" text-anchor="middle" font-weight="600" fill="#1d2935">Mock provider A (fast)</text><rect x="650" y="380" width="230" height="40" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="765.0" y="404.0" text-anchor="middle" font-weight="600" fill="#1d2935">Mock provider B (slow, noisy)</text><rect x="20" y="350" width="200" height="60" rx="5" fill="#eaf1f8" stroke="#1f5f99"/><text x="120.0" y="377.0" text-anchor="middle" font-weight="600" fill="#1d2935">Call service</text><text x="120.0" y="393.0" text-anchor="middle" font-size="11" fill="#4b5967">state machine, events, holds</text><rect x="20" y="450" width="200" height="60" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="120.0" y="477.0" text-anchor="middle" font-weight="600" fill="#1d2935">Reconciler</text><text x="120.0" y="493.0" text-anchor="middle" font-size="11" fill="#4b5967">adopts or releases stuck calls</text><rect x="330" y="450" width="230" height="60" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="445.0" y="477.0" text-anchor="middle" font-weight="600" fill="#1d2935">SQLite (WAL)</text><text x="445.0" y="493.0" text-anchor="middle" font-size="11" fill="#4b5967">agents, borrowers, calls, events, outbox, audit</text><rect x="650" y="450" width="230" height="60" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="765.0" y="477.0" text-anchor="middle" font-weight="600" fill="#1d2935">Webhook / event ingest</text><text x="765.0" y="493.0" text-anchor="middle" font-size="11" fill="#4b5967">at least once, any order</text><line x1="120" y1="110" x2="120" y2="150" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="220" y1="70" x2="330" y2="70" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="275.0" y="64.0" font-size="11" fill="#4b5967" text-anchor="middle">proposal</text><line x1="445" y1="110" x2="445" y2="150" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="445" y1="210" x2="445" y2="250" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="445.0" y="228.0" font-size="11" fill="#4b5967" text-anchor="middle">ApprovedDispatch</text><line x1="445" y1="310" x2="445" y2="350" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="445.0" y="328.0" font-size="11" fill="#4b5967" text-anchor="middle">place after commit</text><line x1="560" y1="380" x2="650" y2="350" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="560" y1="390" x2="650" y2="400" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="650" y1="475" x2="560" y2="475" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="605.0" y="469.0" font-size="11" fill="#4b5967" text-anchor="middle">events</text><line x1="330" y1="480" x2="220" y2="480" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><line x1="120" y1="450" x2="120" y2="410" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="150.0" y="430.0" font-size="11" fill="#4b5967" text-anchor="middle">retries</text><line x1="330" y1="380" x2="220" y2="380" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="275.0" y="374.0" font-size="11" fill="#4b5967" text-anchor="middle">outcomes</text><text x="20" y="542" font-size="12" fill="#4b5967">The pacing engine never imports the controller, the database or a provider (checked by tests/test_architecture.py). Every state change is a compare-and-swap in SQLite.</text></svg>
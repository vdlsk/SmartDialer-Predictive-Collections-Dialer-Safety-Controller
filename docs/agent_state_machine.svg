<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5967"/></marker></defs><rect width="1040" height="420" fill="#fff"/><text x="20" y="26" font-size="15" font-weight="700" fill="#1d2935">Agent state machine</text><rect x="20" y="180" width="140" height="46" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="90.0" y="207.0" text-anchor="middle" font-weight="600" fill="#1d2935">OFFLINE</text><rect x="190" y="180" width="140" height="46" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="260.0" y="207.0" text-anchor="middle" font-weight="600" fill="#1d2935">AVAILABLE</text><rect x="360" y="100" width="140" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="430.0" y="127.0" text-anchor="middle" font-weight="600" fill="#1d2935">RESERVED</text><rect x="530" y="100" width="140" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="600.0" y="127.0" text-anchor="middle" font-weight="600" fill="#1d2935">DIALING</text><rect x="700" y="180" width="140" height="46" rx="5" fill="#eaf1f8" stroke="#78858f"/><text x="770.0" y="207.0" text-anchor="middle" font-weight="600" fill="#1d2935">CONNECTED</text><rect x="530" y="290" width="140" height="46" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="600.0" y="317.0" text-anchor="middle" font-weight="600" fill="#1d2935">WRAP_UP</text><rect x="190" y="330" width="140" height="46" rx="5" fill="#f6f7f9" stroke="#78858f"/><text x="260.0" y="357.0" text-anchor="middle" font-weight="600" fill="#1d2935">PAUSED</text><line x1="160" y1="203" x2="190" y2="203" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="175.0" y="197.0" font-size="11" fill="#4b5967" text-anchor="middle">login</text><line x1="260" y1="180" x2="400" y2="146" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="310" y="150" font-size="11" fill="#4b5967">reserve (CAS)</text><line x1="500" y1="123" x2="530" y2="123" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="515.0" y="90" font-size="11" fill="#4b5967" text-anchor="middle">placed</text><line x1="670" y1="123" x2="730" y2="180" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="722" y="140" font-size="11" fill="#4b5967">answered</text><line x1="770" y1="226" x2="670" y2="313" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="754.0" y="269.5" font-size="11" fill="#4b5967" text-anchor="middle">hang up</text><line x1="530" y1="313" x2="260" y2="205" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="420" y="270" font-size="11" fill="#4b5967">wrap-up over</text><line x1="260" y1="226" x2="260" y2="330" stroke="#4b5967" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="278.0" font-size="11" fill="#4b5967" text-anchor="middle">pause</text><path d="M 330 123 Q 270 150 255 180" fill="none" stroke="#4b5967" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="300" y="112" font-size="11" fill="#4b5967" text-anchor="end">call failed or cancelled: release</text><path d="M 260 180 Q 360 215 630 146" fill="none" stroke="#4b5967" stroke-dasharray="5 4" marker-end="url(#a)" opacity="0"/><text x="20" y="390" font-size="12" fill="#4b5967">Any state can go OFFLINE (agent drops). AVAILABLE goes straight to CONNECTED when an answered, unbound predictive call is late-bound to a free agent.</text><text x="20" y="408" font-size="12" fill="#4b5967">A busy agent can only be released by the call that holds them (fenced by agents.call_id), so a late event for an old call cannot free someone on a new one.</text></svg>